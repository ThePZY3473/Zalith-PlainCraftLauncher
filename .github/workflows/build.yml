name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "构建变体"
        required: true
        type: choice
        options: ["Debug", "Release"]
        default: "Debug"
      arch:
        description: "目标架构：可多选，用英文逗号分隔（arm64,arm,x86,x86_64,all）；默认 arm64"
        required: true
        type: string
        default: "arm64"
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: "arm64"
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  # GitHub Actions 表达式没有 replace/replaceAll，无法直接在矩阵里拆字符串，
  # 所以先用一个轻量 job 把 "arm64,arm" 解析成 JSON 数组。
  prepare:
    if: github.event_name != 'pull_request'
    name: 解析目标架构
    runs-on: ubuntu-latest
    outputs:
      archs: ${{ steps.parse.outputs.archs }}
    steps:
      - name: 解析 arch 输入
        id: parse
        shell: bash
        env:
          RAW_ARCH: ${{ inputs.arch }}
        run: |
          raw="${RAW_ARCH// /}"
          IFS=',' read -ra parts <<< "$raw"
          archs=()
          for a in "${parts[@]}"; do
            case "$a" in
              arm64|arm|x86|x86_64|all) archs+=("\"$a\"") ;;
              *) echo "::error::未知架构：${a}（可选 arm64, arm, x86, x86_64, all）"; exit 1 ;;
            esac
          done
          if [ ${#archs[@]} -eq 0 ]; then
            echo "::error::未指定任何架构"
            exit 1
          fi
          json="[$(IFS=,; echo "${archs[*]}")]"
          echo "archs=${json}" >> "$GITHUB_OUTPUT"
          echo "目标架构：${json}"

  build:
    if: github.event_name != 'pull_request'
    needs: prepare
    name: Build ${{ inputs.variant }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.archs) }}
      fail-fast: false

    env:
      # 签名密码对所有变体注入：CI 上的 Debug 包也用项目密钥签名，便于直接覆盖安装。
      # 正版登录 / CurseForge 配置只在 Release 注入，避免构建产物携带发行线专用凭据。
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ inputs.variant == 'Release' && secrets.OAUTH_CLIENT_ID || '' }}
      CURSEFORGE_API_KEY: ${{ inputs.variant == 'Release' && secrets.CURSEFORGE_API_KEY || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }}

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/release/*.apk

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: debug apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
